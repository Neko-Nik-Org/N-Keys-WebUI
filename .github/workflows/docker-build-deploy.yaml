name: Docker Image CI - Build

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Determine Docker tag
        id: tag
        run: echo "TAG=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          tags: |
            neko7nik/n-keys-ui:latest
            neko7nik/n-keys-ui:${{ steps.tag.outputs.TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          # Copy the docker-compose.yaml file to the server (Replace with existing file)
          scp -o StrictHostKeyChecking=no docker-compose.yaml root@$SERVER_IP:/srv/n-keys-ui/docker-compose.yaml

          # Connect and restart the service
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << 'EOF'
            cd /srv/n-keys-ui
            docker compose pull
            docker compose up -d
            docker ps
          EOF
